---
- name: Discover running VMs with DPDK vhost-user or SR-IOV NICs
  ansible.builtin.shell:
    cmd: |
      python3 - <<'PY'
      import csv
      import io
      import json
      import re
      import subprocess

      def run(args):
          return subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=False)

      pool = run(['onevm', 'list', '--csv', '-l', 'ID,STAT', '--no-header'])
      if pool.returncode != 0:
          print(json.dumps({'error': pool.stderr.strip() or 'onevm list failed', 'vms': []}))
          raise SystemExit(0)

      out = []
      for row in csv.reader(io.StringIO(pool.stdout)):
          if len(row) < 2 or row[1].strip() != 'runn':
              continue
          vm_id = row[0].strip()
          shown = run(['onevm', 'show', vm_id, '-j'])
          if shown.returncode != 0:
              continue
          try:
              vm = json.loads(shown.stdout)['VM']
          except Exception:
              continue

          nic_raw = (vm.get('TEMPLATE') or {}).get('NIC', [])
          nics = [nic_raw] if isinstance(nic_raw, dict) else (nic_raw or [])
          targets = []
          pci_ids = []
          for nic in nics:
              target = str(nic.get('TARGET', ''))
              pci = str(nic.get('PCI_ID', ''))
              if re.fullmatch(r'one-\d+-\d+', target):
                  targets.append(target)
              if re.search(r'(?:(?:[0-9a-fA-F]{4}):)?[0-9a-fA-F]{2}:[0-9a-fA-F]{2}\.[0-7]', pci):
                  pci_ids.append(pci)

          if not targets and not pci_ids:
              continue

          history_raw = (vm.get('HISTORY_RECORDS') or {}).get('HISTORY', [])
          history = history_raw[-1] if isinstance(history_raw, list) and history_raw else history_raw
          host = str((history or {}).get('HOSTNAME', '')) if isinstance(history, dict) else ''
          if not host:
              continue
          out.append({
              'id': str(vm.get('ID', vm_id)),
              'name': str(vm.get('NAME', f'one-{vm_id}')),
              'host': host,
              'targets': sorted(set(targets)),
              'pci_ids': sorted(set(pci_ids)),
          })

      print(json.dumps({'error': '', 'vms': out}))
      PY
    executable: /bin/bash
  register: _vvn_existing_raw
  changed_when: false
  become: true
  become_user: oneadmin

- name: Parse existing VM discovery
  ansible.builtin.set_fact:
    _vvn_existing: "{{ _vvn_existing_raw.stdout | from_json }}"

- name: Record read-only discovery failure
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "VM vNIC NUMA locality"
    result_value: failed
    result_comment: "{{ _vvn_existing.error }}"
  when: (_vvn_existing.error | d('') | length) > 0

- name: Record no applicable running VMs
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "VM vNIC NUMA locality"
    result_value: "skipped — no running DPDK vhost-user or SR-IOV VM interfaces discovered"
  when:
    - (_vvn_existing.error | d('') | length) == 0
    - (_vvn_existing.vms | d([]) | length) == 0

- name: Inspect running VM vNIC NUMA locality
  ansible.builtin.include_tasks: inspect_vm.yml
  loop: "{{ _vvn_existing.vms | d([]) }}"
  loop_control:
    loop_var: _vvn_existing_vm
    label: "{{ _vvn_existing_vm.name }}"
  when: (_vvn_existing.error | d('') | length) == 0
