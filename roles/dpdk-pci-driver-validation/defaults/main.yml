---
# Expected driver for inventory-defined physical DPDK PCI devices.
# Per-device exceptions can be configured through:
#
# validation:
#   dpdk_pci_driver:
#     default_driver: vfio-pci
#     driver_overrides:
#       "0000:01:00.0": mlx5_core

dpdk_pci_driver_validation_defaults:
  default_driver: vfio-pci
  driver_overrides: {}

# Source used to discover inventory-defined OVS DPDK interfaces.
#
# Normally this is the deployment inventory for the current host. Tests may
# override it without changing the actual inventory or host configuration.
dpdk_pci_driver_inventory_ovs: >-
  {{
    hostvars[inventory_hostname].ovs
    | d({})
  }}
