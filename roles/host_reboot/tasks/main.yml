---
- name: "Host reboot validation: skip - cluster discovery failed"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Host reboot validation"
    result_value: "skipped - cluster discovery failed"
  when:
    - validation.run_host_reboot | d(false)
    - hostvars[groups[frontend_group | d('frontend')][0]].odv_discovery_failed | d(false)

- name: Initialize host reboot validation logic
  when:
    - validation.run_host_reboot | d(false)
    - not (hostvars[groups[frontend_group | d('frontend')][0]].odv_discovery_failed | d(false))
    - inventory_hostname == groups[frontend_group | d('frontend')][0]
  block:
    - name: Parse user target preference
      ansible.builtin.set_fact:
        _hr_target_preference: >-
          {%- set raw = validation.host_reboot.target_nodes | d('all') -%}
          {%- if raw == 'all' or raw == ['all'] or raw == '' or raw == [] -%}
            {{ groups[node_group | d('node')] | default([]) }}
          {%- elif raw is string -%}
            {{ raw.split(',') | map('trim') | reject('equalto', '') | list }}
          {%- elif raw is sequence -%}
            {{ raw }}
          {%- else -%}
            []
          {%- endif -%}

    - name: Build list of frontend names to protect
      ansible.builtin.set_fact:
        _protected_frontend_names: >-
          {{
            groups[frontend_group | d('frontend')]
            | map('extract', hostvars)
            | map(attribute='inventory_hostname')
            | list
          }}

    - name: Read current OpenNebula host pool
      ansible.builtin.command: onehost list -j
      become: true
      become_user: oneadmin
      register: _hr_host_pool
      changed_when: false
      failed_when: false

    - name: Record failure if OpenNebula API is unresponsive
      ansible.builtin.include_role:
        name: validation_common
        tasks_from: record_result.yml
      vars:
        result_key: "Host reboot validation"
        result_value: "failed"
        result_comment: "Failed to read onehost pool from frontend"
      when: _hr_host_pool.rc != 0

    - name: "Record skip if no target nodes found"
      ansible.builtin.include_role:
        name: validation_common
        tasks_from: record_result.yml
      vars:
        result_key: "Host reboot validation"
        result_value: "skipped — no target nodes found in inventory"
      when:
        - _hr_host_pool.rc == 0
        - (_hr_target_preference | length) == 0

    - name: Run sequential reboot verification across target hypervisors
      ansible.builtin.include_tasks: host_reboot_node.yml
      loop: "{{ _hr_target_preference }}"
      loop_control:
        loop_var: selected_node
        label: "{{ selected_node }}"
      when:
        - _hr_host_pool.rc == 0
        - (_hr_target_preference | length) > 0

    - name: Record aggregate host reboot validation result
      ansible.builtin.include_role:
        name: validation_common
        tasks_from: record_result.yml
      vars:
        _failed_checks: >-
          {{
            (verification_result | default({})) | dict2items
            | rejectattr('key', 'equalto', 'Host reboot validation')
            | selectattr('key', 'search', 'reboot|re-monitoring|System journal')
            | selectattr('value', 'string')
            | selectattr('value', 'search', 'failed|error')
            | map(attribute='key') | list
          }}
        result_key: "Host reboot validation"
        result_value: "{{ 'failed' if (_failed_checks | length > 0) else 'ok' }}"
        result_comment: "{{ '' if (_failed_checks | length == 0) else ('Failed checks: ' ~ (_failed_checks | join(', '))) }}"
      when:
        - _hr_host_pool.rc == 0
        - (_hr_target_preference | length) > 0
